name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  commit-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for AI co-author traces
        shell: bash
        run: |
          FORBIDDEN=$(git log origin/main..HEAD --format="%B" | grep -iE "co-authored-by:.*(claude|anthropic|openai|copilot)" || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::AI co-author trace found in commit messages"
            echo "$FORBIDDEN"
            exit 1
          fi

      - name: Check commit author emails
        shell: bash
        env:
          ALLOWED_EMAIL: "1733111+jadunawa@users.noreply.github.com"
        run: |
          BAD_EMAILS=$(git log origin/main..HEAD --format="%ae" | grep -v "$ALLOWED_EMAIL" | sort -u || true)
          if [ -n "$BAD_EMAILS" ]; then
            echo "::error::Commits from unauthorized email(s): $BAD_EMAILS"
            exit 1
          fi

  build-and-test:
    runs-on: ${{ vars.ANDROID_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK (when not on ARC)
        if: ${{ !vars.ANDROID_RUNNER }}
        uses: android-actions/setup-android@v3

      - name: Run game-engine tests
        run: gradle :game-engine:test

      - name: Run app unit tests
        run: gradle :app:testDebugUnitTest

      - name: Lint
        run: gradle :app:lintDebug

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/debug.p12"

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/debug.p12
        run: gradle :app:assembleDebug -Pci.versionCode="$VERSION_CODE" "-Pci.keystorePath=$KEYSTORE_PATH" "-Pci.keystorePassword=$KEYSTORE_PASSWORD"

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/farkle-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/farkle-debug.apk

      - name: Publish to debug-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release upload debug-latest app/build/outputs/apk/debug/farkle-debug.apk --clobber
            gh release edit debug-latest --title "Debug Build #$RUN_NUMBER" --notes "$RUN_NUMBER"
          else
            gh release create debug-latest app/build/outputs/apk/debug/farkle-debug.apk \
              --title "Debug Build #$RUN_NUMBER" --notes "$RUN_NUMBER" --prerelease
          fi
