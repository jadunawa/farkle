name: Debug Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-release:
    runs-on: ${{ vars.ANDROID_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK (when not on ARC)
        if: ${{ !vars.ANDROID_RUNNER }}
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/debug.p12"

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleDebug -Pci.versionCode=${{ github.run_number }} "-Pci.keystorePath=${{ runner.temp }}/debug.p12" "-Pci.keystorePassword=$KEYSTORE_PASSWORD"

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/farkle-debug.apk

      - name: Create or update debug-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Debug Build #${{ github.run_number }}"
          body: "${{ github.run_number }}"
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/farkle-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove old APK assets
        run: |
          gh release view debug-latest --json assets -q '.assets[].name' | \
            grep -v "farkle-debug.apk" | \
            xargs -I{} gh release delete-asset debug-latest "{}" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
