name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ vars.ANDROID_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK (when not on ARC)
        if: ${{ !vars.ANDROID_RUNNER }}
        uses: android-actions/setup-android@v3

      - name: Run game-engine tests
        run: gradle :game-engine:test

      - name: Run app unit tests
        run: gradle :app:testDebugUnitTest

      - name: Lint
        run: gradle :app:lintDebug

      - name: Build debug APK
        run: gradle :app:assembleDebug
